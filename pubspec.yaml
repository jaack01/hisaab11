name: hisaab
description: A production-grade digital accounting ledger app for small and medium businesses
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # UI/UX
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Localization
  intl: ^0.19.0

  # PDF & Reports
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.3

  # File & Media
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  permission_handler: ^11.3.1

  # Communication
  url_launcher: ^6.3.1

  # Charts & Visualization
  fl_chart: ^0.69.0

  # Security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  encrypt: ^5.0.3

  # Utilities
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  uuid: ^4.5.1

  # Functional Programming
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Logging
  logger: ^2.4.0

  # Firebase (Production Monitoring & Analytics)
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_performance: ^0.10.0+8

  # In-App Review
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700
